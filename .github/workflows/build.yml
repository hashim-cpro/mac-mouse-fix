name: Build Mac Mouse Fix

on:
  push:
    branches:
      - remove_mac_mouse_fix_paywall
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Mac Mouse Fix (Paywall-Free)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build Application
        run: |
          xcodebuild -project "Mouse Fix.xcodeproj" \
                     -scheme "App - Release" \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGN_STYLE="Manual" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES

      - name: Verify and Sign Bundle (Ad-hoc)
        run: |
          APP_PATH="./build/Build/Products/Release/Mac Mouse Fix.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH does not exist!"
            exit 1
          fi
          echo "Ad-hoc signing application bundle and embedded helpers..."
          codesign --force --deep -s - "$APP_PATH"

      - name: Create Zip Archive
        run: |
          cd ./build/Build/Products/Release
          zip -r -y "Mac-Mouse-Fix-Paywall-Free.zip" "Mac Mouse Fix.app"
          ls -lh "Mac-Mouse-Fix-Paywall-Free.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Mouse-Fix-Paywall-Free
          path: ./build/Build/Products/Release/Mac-Mouse-Fix-Paywall-Free.zip
          retention-days: 30
